[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rvtools-hw-check"
version = "0.1.0"
description = "Check RVTools ESXi host hardware against the Red Hat Ecosystem Catalog for OpenShift and OpenShift Virtualization certification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
    "markdown>=3.5",
    "weasyprint>=60",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "responses>=0.25",
    "pypdf>=4",
    "xlwt>=1.3",
]

[project.scripts]
rvtools-hw-check = "rvtools_hw_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rvtools_hw_check = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
